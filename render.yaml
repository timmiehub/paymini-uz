services:
  - type: web
    name: paymini
    runtime: node
    plan: free
    buildCommand: cd webapp && npm ci && npm run build && cd ../bot && npm ci
    startCommand: node bot/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: LOCAL_STORE
        value: "1"
      - key: PAYME_DEMO
        value: "1"
      - key: BOT_TOKEN
        sync: false
